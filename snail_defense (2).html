const playAgainBtn = document.getElementById('playAgain');
const startBtn = document.getElementById('startBtn');

// Center buttons over the canvas
function positionButton(btn, yOffset = 70) {
  const rect = canvas.getBoundingClientRect();
  btn.style.left = (rect.left + rect.width / 2 - btn.offsetWidth / 2) + 'px';
  btn.style.top = (rect.top + rect.height / 2 + yOffset) + 'px';
}
window.addEventListener('resize', () => {
  if (playAgainBtn.style.display !== 'none') positionButton(playAgainBtn);
  if (startBtn.style.display !== 'none') positionButton(startBtn, 110);
});
playAgainBtn.addEventListener('click', resetGame);
startBtn.addEventListener('click', startGame);

function startGame() {
  gameState = 'playing';
  startBtn.style.display = 'none';
  lastTime = performance.now();
  // short pause before first inchworm
  setTimeout(() => {
    if (gameState === 'playing') {
      // interval will handle the rest
    }
  }, 1500);
}

function resetGame() {
  snailY = 180;
  bullets = [];
  inchworms = [];
  vegetables = 8;
  score = 0;
  timeLeft = 60;
  gameState = 'playing';
  shootCooldown = 0;
  playAgainBtn.style.display = 'none';
  startBtn.style.display = 'none';
  lastTime = performance.now();
}

// Game state
let snailY = 180;           // vertical position of the snail
const snailW = 108;
const snailH = 126;
const snailX = 168;         // just in front of the carrot pile
let bullets = [];           // active bullets
let inchworms = [];         // active inchworms
let vegetables = 8;         // starting vegetable pile
let score = 0;
let timeLeft = 60;          // seconds
let lastTime = 0;
let gameState = 'tutorial';  // 'tutorial', 'playing', 'won', 'lost'
let shootCooldown = 0;

// Keyboard state
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', e => keys[e.key] = false);

// ===== SPAWN INCHWORMS =====
// New inchworm appears from the right at a random height every 1–2 seconds
setInterval(() => {
  if (gameState !== 'playing') return;
  inchworms.push({
    x: canvas.width,
    y: 24 + Math.random() * (canvas.height - 90),
    w: 168,
    h: 42,
    hits: 0,                // needs 3 hits to die
    speed: 0.35 + Math.random() * 0.25   // slower crawl
  });
}, 1800 + Math.random() * 1000);

// ===== MAIN GAME LOOP =====
function loop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  if (gameState === 'playing') {
    // Move snail up/down with arrow keys (slower)
    if (keys['ArrowUp'])   snailY = Math.max(0, snailY - 2);
    if (keys['ArrowDown']) snailY = Math.min(canvas.height - snailH, snailY + 2);

    // Shoot with space (simple cooldown so it doesn't fire every frame)
    if (keys[' '] && shootCooldown <= 0) {
      bullets.push({
        x: snailX + snailW - 10,
        y: snailY + snailH * 0.42,
        r: 6,
        speed: 7
      });
      shootCooldown = 18; // frames
    }
    if (shootCooldown > 0) shootCooldown--;

    // Move bullets right
    bullets.forEach(b => b.x += b.speed);
    bullets = bullets.filter(b => b.x < canvas.width + 10);

    // Move inchworms left
    inchworms.forEach(iw => iw.x -= iw.speed);

    // Bullet vs inchworm collisions
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = inchworms.length - 1; j >= 0; j--) {
        const iw = inchworms[j];
        if (b.x > iw.x && b.x < iw.x + iw.w &&
            b.y > iw.y && b.y < iw.y + iw.h) {
          iw.hits++;
          bullets.splice(i, 1);
          if (iw.hits >= 3) {
            inchworms.splice(j, 1);
            score++;
          }
          break;
        }
      }
    }

    // Inchworm reaches past the snail → lose a vegetable
    for (let j = inchworms.length - 1; j >= 0; j--) {
      if (inchworms[j].x < snailX) {
        inchworms.splice(j, 1);
        vegetables--;
        if (vegetables <= 0) {
          gameState = 'lost';
        }
      }
    }

    // Count down the 60-second timer
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameState = vegetables > 0 ? 'won' : 'lost';
      playAgainBtn.style.display = 'block';
      positionButton(playAgainBtn);
    }
  }

  // Show play again only on win/lose
  if ((gameState === 'won' || gameState === 'lost') && playAgainBtn.style.display !== 'block') {
    playAgainBtn.style.display = 'block';
    positionButton(playAgainBtn);
  }

  // Show start button during tutorial
  if (gameState === 'tutorial' && startBtn.style.display !== 'block') {
    startBtn.style.display = 'block';
    positionButton(startBtn, 110);
  }

  draw();
  requestAnimationFrame(loop);
}

// Top-down pixel dirt with short grass blades, drawn once
function makeGround() {
  const g = document.createElement("canvas");
  g.width = canvas.width;
  g.height = canvas.height;
  const gx = g.getContext("2d");
  gx.imageSmoothingEnabled = false;
  gx.fillStyle = "#6b4423";
  gx.fillRect(0, 0, g.width, g.height);

  const dirt = ["#7a4e28", "#5a381c", "#8a5a30", "#4e3018", "#9a6840"];
  for (let y = 0; y < g.height; y += 4) {
    for (let x = 0; x < g.width; x += 4) {
      const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      const f = n - Math.floor(n);
      if (f > 0.32) {
        gx.fillStyle = dirt[(x + y) % dirt.length];
        gx.fillRect(x, y, f > 0.9 ? 8 : 4, f > 0.9 ? 8 : 4);
      }
    }
  }

  const stones = ["#5c5348", "#8a8074", "#3e342c", "#a89880"];
  for (let i = 0; i < 90; i++) {
    const x = Math.floor((Math.sin(i * 47.1) * 19321.7 % 1 + 1) % 1 * (g.width - 10));
    const y = Math.floor((Math.sin(i * 13.9 + 2) * 8123.4 % 1 + 1) % 1 * (g.height - 10));
    gx.fillStyle = "#2a241c";
    gx.fillRect(x, y, 10, 10);
    gx.fillStyle = stones[i % stones.length];
    gx.fillRect(x + 2, y + 2, 6, 6);
    gx.fillStyle = "#c8bba8";
    gx.fillRect(x + 2, y + 2, 2, 2);
  }

  const greens = ["#2f7a34", "#3f9a3a", "#1f5c28", "#67b04a"];
  for (let b = 0; b < 150; b++) {
    const bx = Math.floor((Math.sin(b * 33.1) * 9001.3 % 1 + 1) % 1 * g.width);
    const by = Math.floor((Math.sin(b * 19.7 + 1) * 4211.8 % 1 + 1) % 1 * g.height);
    const blades = 6 + (b % 3);
    for (let k = 0; k < blades; k++) {
      const x = bx + ((k * 5 + b) % 14) - 6;
      const y = by + ((k * 7) % 12) - 4;
      gx.fillStyle = greens[(b + k) % greens.length];
      const len = 6 + ((b + k) % 3) * 2;
      const dir = (b + k) % 4;
      if (dir === 0) gx.fillRect(x, y, 2, len);
      else if (dir === 1) gx.fillRect(x, y, len, 2);
      else if (dir === 2) {
        gx.fillRect(x, y, 2, 2);
        gx.fillRect(x + 2, y + 2, 2, 2);
        gx.fillRect(x + 4, y + 4, 2, 2);
      } else {
        gx.fillRect(x, y + 4, 2, 2);
        gx.fillRect(x + 2, y + 2, 2, 2);
        gx.fillRect(x + 4, y, 2, 2);
      }
    }
  }
  return g;
}
const ground = makeGround();

function drawPixelPanel(x, y, w, h) {
  ctx.fillStyle = "#2a1a0c";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "#c4a574";
  ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
  ctx.fillStyle = "#3d2914";
  ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
}

function centerText(text, y) {
  ctx.fillText(text, canvas.width / 2 - ctx.measureText(text).width / 2, y);
}

// ===== DRAWING =====
function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ground, 0, 0);

  // Carrot pile — centered vertically on the left side
  const vegW = 30;
  const vegH = 88;
  const gapX = 6;
  const gapY = 8;
  const cols = 4;
  const rows = Math.ceil(Math.max(vegetables, 1) / cols);
  const pileH = rows * vegH + (rows - 1) * gapY;
  const pileX = 14;
  const pileY = (canvas.height - pileH) / 2;

  for (let i = 0; i < vegetables; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = pileX + col * (vegW + gapX);
    const y = pileY + row * (vegH + gapY);
    if (carrotImg.complete && carrotImg.naturalWidth) {
      ctx.drawImage(carrotImg, x, y, vegW, vegH);
    }
  }

  // Snail sits a little in front of the carrot pile, facing the inchworms
  if (snailImg.complete && snailImg.naturalWidth) {
    ctx.drawImage(snailImg, snailX, snailY, snailW, snailH);
  }

  // Bullets (small yellow circles)
  ctx.fillStyle = '#FFD700';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Inchworms crawl in from the right, head facing left
  inchworms.forEach(iw => {
    if (wormImg.complete && wormImg.naturalWidth) {
      ctx.drawImage(wormImg, iw.x, iw.y, iw.w, iw.h);
    }
  });

  // Score, timer, and vegetable count in a pixel box
  const boxX = 10;
  const boxY = 10;
  const boxW = 210;
  const boxH = 84;
  ctx.fillStyle = "#2a1a0c";
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = "#c4a574";
  ctx.fillRect(boxX + 4, boxY + 4, boxW - 8, boxH - 8);
  ctx.fillStyle = "#3d2914";
  ctx.fillRect(boxX + 8, boxY + 8, boxW - 16, boxH - 16);
  ctx.fillStyle = "#f3e2b3";
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.fillText(`Score: ${score}`, boxX + 16, boxY + 28);
  ctx.fillText(`Time: ${Math.ceil(timeLeft)}s`, boxX + 16, boxY + 50);
  ctx.fillText(`Vegetables: ${vegetables}`, boxX + 16, boxY + 72);

  // Tutorial screen
  if (gameState === 'tutorial') {
    ctx.fillStyle = 'rgba(20, 12, 6, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const w = 660;
    const h = 300;
    const x = (canvas.width - w) / 2;
    const y = (canvas.height - h) / 2 - 16;
    drawPixelPanel(x, y, w, h);
    ctx.fillStyle = '#f3e2b3';
    ctx.font = '22px monospace';
    centerText('How to Play', y + 52);
    ctx.font = '16px monospace';
    centerText('Move the snail up and down with Arrow keys', y + 104);
    centerText('Shoot with Space — hit an inchworm 3 times to kill it', y + 134);
    centerText('Win: keep some vegetables after 60 seconds', y + 164);
    centerText('Lose: if all vegetables disappear', y + 194);
    ctx.textAlign = 'left';
  }

  // End messages
  if (gameState === 'won' || gameState === 'lost') {
    ctx.fillStyle = 'rgba(20, 12, 6, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const w = 480;
    const h = 200;
    const x = (canvas.width - w) / 2;
    const y = (canvas.height - h) / 2 - 24;
    drawPixelPanel(x, y, w, h);
    ctx.fillStyle = '#f3e2b3';
    ctx.font = '28px monospace';
    if (gameState === 'won') {
      centerText('YOU WIN!', y + 70);
      ctx.font = '16px monospace';
      centerText(vegetables === 8 ? 'Perfect Score!' : `Vegetables left: ${vegetables}`, y + 112);
    } else {
      centerText('GAME OVER', y + 70);
      ctx.font = '16px monospace';
      centerText('All vegetables were eaten!', y + 112);
    }
    ctx.textAlign = 'left';
  }
}

// Start the game
requestAnimationFrame(loop);
</script>
